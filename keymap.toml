[input]
prepend_keymap = [
    { on = "<Esc>", run = "close", desc = "Cancel input (skip normal-mode step)" },
]

[mgr]

prepend_keymap = [
    # Tabs
    { on = ["t","c"], run = "close", desc = "Close the current tab" },
    { on = "C",         run = "plugin archive-manager -- compress",  desc = "Compress selection" },
    { on = "d",         run = "yank --cut",                 desc = "Yank selected files (cut)" },
    { on = "D",         run = "unyank",                     desc = "Cancel the yank status" },
    { on = "x",         run = "plugin safe-remove",              desc = "Trash selected files (safe for MTP)" },
    { on = "X",         run = "plugin safe-remove --permanent",  desc = "Permanently delete selected files" },
    { on = "<Delete>",  run = "plugin safe-remove",              desc = "Trash selected files (safe for MTP)" },
    { on = "<S-Delete>", run = "plugin safe-remove --permanent", desc = "Permanently delete selected files" },
    { on = "e",         run = 'shell -- ripdrag --all --and-exit "$@"', desc = "Drag and drop files" },
    { on = "u",         run = "plugin trash-manager -- undo-last", desc = "Restore last trashed batch" },
    { on = "U",         run = "plugin trash-manager",       desc = "Trash manager (view/restore/delete)" },
    { on = "F",         run = "plugin smart-filter",        desc = "Smart filter" },
    { on = "s",         run = "ya calc --size",            desc = "Calculate directory sizes" },

    # mounter
    { on = "M",         run = "plugin mounter",           desc = "Open mounter interface" },
    { on = ["G","m"],   run = "cd /run/user/1000/gvfs", desc = "Go to mounts (gvfs)" },
    { on = ["`","`"],   run = "plugin simple-mtpfs -- jump-back-prev-cwd", desc = "Jump back to the position before jumped to device" },

    # Bookmark Handling
    { on = ["b","m"],   run = 'shell -- mark "$(basename $(pwd))"', desc = "Bookmark current dir" },
    { on = ["b","u"],   run = 'shell -- unmark "$(basename $(pwd))"', desc = "Unmark current dir" },
    # safer: offload interactive rename to a wrapper function in zsh
    { on = ["b","r"],   run = "shell -- remark_prompt", desc = "Rename bookmark" },
    { on = ["b","l"], run = "spot -- lsbm", desc = "Show bookmarks in floating window" },
    { on = ["g","b"],   run = "cd ~/.cache/bookmarks", desc = "Goto bookmarks dir" },

    { on = ["E"], run = 'plugin archive-manager', desc = "Extract selected archives with 7z (background)" },

    { on = ["c","p"], run = "copy path", desc = "Copy file URL" },
    { on = ["c","c"], run = "plugin copy-content", desc = "Copy file content (text/empty)" },
]

append_keymap = [
    { on = "i", run = "spot", desc = "Spot (show file info)" },
]
